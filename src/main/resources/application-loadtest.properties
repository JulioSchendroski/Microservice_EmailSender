# Profile de teste de carga: SMTP MOCKADO (nenhum e-mail real é enviado).
# Ative com SPRING_PROFILES_ACTIVE=loadtest ao subir a app para o k6.
#
# Herda datasource/RabbitMQ do application.properties (ajuste via env vars).
# A única mudança essencial é substituir o JavaMailSender real pelo mock
# (ver LoadTestMailConfig), garantindo que NENHUM e-mail seja enviado.

# Latência simulada do "SMTP" (ms) — deixa o custo do modo síncrono visível.
loadtest.smtp.latency-ms=${LOADTEST_SMTP_LATENCY_MS:150}
