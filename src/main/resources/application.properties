server.port=${SERVER_PORT:8080}

# ---------- Datasource ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ms_email}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# ---------- Mail (SMTP) ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- RabbitMQ connection ----------
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}

# ---------- RabbitMQ topology (app) ----------
app.rabbitmq.exchange=email.exchange
app.rabbitmq.queue=email.queue
app.rabbitmq.routing-key=email.send
app.rabbitmq.dlx=email.dlx
app.rabbitmq.dlq=email.dlq
app.rabbitmq.dlq-routing-key=email.dead

# ---------- RabbitMQ consumer retry ----------
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000
# Ap\u00f3s esgotar as tentativas, rejeita sem requeue -> vai para a DLQ via DLX
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# N\u00famero de consumers concorrentes drenando a fila (paraleliza o processamento).
# Ajust\u00e1vel via env RABBITMQ_CONCURRENT_CONSUMERS / RABBITMQ_MAX_CONSUMERS.
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_CONCURRENT_CONSUMERS:1}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_MAX_CONSUMERS:1}
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:1}

# ---------- OpenAPI / Swagger UI ----------
springdoc.swagger-ui.path=/swagger-ui.html
